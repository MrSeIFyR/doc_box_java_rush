services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: docbox_db
      DB_USER: postgres
      DB_PASSWORD: password
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: docbox_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5534:5432"

    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docbox_db"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  db_data: